name: Daily Digest

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily digest
        env:
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/daily_digest.py

      - name: Commit updated state + insights
        run: |
          git config user.name "sleeper-ff-bot"
          git config user.email "actions@github.com"
          git pull --rebase
          git add state.json docs/data/player_insights.json
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push
