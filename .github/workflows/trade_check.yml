name: Trade Analyzer (manual)

on:
  workflow_dispatch:
    inputs:
      giving_up:
        description: "Players YOU would give up (comma separated)"
        required: true
      receiving:
        description: "Players YOU would receive (comma separated)"
        required: true
      roster_context:
        description: "Optional: brief note on your roster/needs"
        required: false
        default: ""

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Analyze trade
        env:
          GIVING_UP: ${{ inputs.giving_up }}
          RECEIVING: ${{ inputs.receiving }}
          ROSTER_CONTEXT: ${{ inputs.roster_context }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/manual_trade_check.py
