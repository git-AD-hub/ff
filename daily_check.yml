name: Sleeper Check

on:
  schedule:
    # Runs every 6 hours (UTC). GitHub may delay this a few minutes at busy times.
    - cron: "0 */6 * * *"
    # Extra guaranteed run Wednesday ~9am ET (13:00 UTC), safely after most
    # leagues' 2am waiver processing finishes, so waiver suggestions are
    # never missed or based on stale (pre-waiver) rosters.
    - cron: "0 13 * * 3"
  workflow_dispatch: {}  # lets you click "Run workflow" manually to test

permissions:
  contents: write  # needed to commit updated state.json back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run checker
        env:
          SLEEPER_USERNAME: ${{ secrets.SLEEPER_USERNAME }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python src/checker.py

      - name: Commit updated state
        run: |
          git config user.name "sleeper-ff-bot"
          git config user.email "actions@github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push
